# ============================================================
#  小黑搜影 — Docker Compose 一键部署
# ============================================================
# 启动:  docker compose up -d
# 日志:  docker compose logs -f
# 停止:  docker compose down
# 重建:  docker compose up -d --build
# ============================================================

services:
  # ---- Python 后端 ----
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: xiaohei-backend
    restart: unless-stopped
    volumes:
      # 持久化 SQLite 数据库 + 配置 + 日志
      - backend-data:/app/data
      - ./sources.json:/app/sources.json:ro
      - ./config.json:/app/config.json:ro
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - xiaohei-net

  # ---- Next.js 前端 ----
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xiaohei-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # 指向后端容器名:端口
      - NEXT_PUBLIC_API_URL=http://backend:8000
    networks:
      - xiaohei-net

  # ---- Nginx 反向代理（统一入口） ----
  nginx:
    image: nginx:alpine
    container_name: xiaohei-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - xiaohei-net

volumes:
  backend-data:

networks:
  xiaohei-net:
    driver: bridge
